# The public repository's release workflow (dongdongdongdongding/devalley, .github/workflows/
# release.yml); this is the copy kept with the source. It builds the installers from this
# private repository, uploads them to devalley.app (the site's R2 bucket, where the download
# page, the app's update check and the Windows installer's updater read them) and publishes the
# release notes on the public Releases page, so releases don't spend this repository's Actions
# minutes. It only builds: checks and tests run before a release, on the source side. Its logs
# are public, so its steps print as little as they can.
#
# One run releases ONE platform, the Mac or Windows, each when its own lane is ready (the source's
# README "Releasing"): it builds that platform alone and moves only its part of latest.json (the
# one pointer; the server derives the Windows feed from it), the other platform's left as it is.
# The same tag is run once for each platform; a platform may skip a version. Before building, the
# check job says where the platform stands: an older version is refused; a version already staged
# or live in the bucket is not built again but committed from what the bucket holds (a run that
# stopped part way resumes; the page and notes are redone). One publish runs at a time (its
# concurrency group), from its read of the bucket through the notes. With dry_run it checks,
# builds (the Mac app signed and notarized as in a release) and lists each installer's name, size
# and digest, and uploads nothing anywhere: no artifact, no bucket, no page, no notes.
#
# Started by hand only (Actions → Release → Run workflow, or `gh workflow run release.yml
# -R dongdongdongdongding/devalley -f version=X.Y.Z -f platform=mac` [-f dry_run=true]), so no
# pull request or fork can reach the secrets: CORE_READ_TOKEN (a fine-grained token with Contents: Read-only on devalley-core),
# CLOUDFLARE_API_TOKEN (account-wide R2: Admin Read & Write or Workers R2 Storage: Edit; a token
# scoped to the bucket alone is refused, see docs/platform.md "Releases") and
# CLOUDFLARE_ACCOUNT_ID; for the Mac app's signature and notarization, MAC_CERT_P12 (the
# "Developer ID Application" certificate with its key, a .p12 in base64), MAC_CERT_PASSWORD (its
# password), APPLE_API_KEY_P8 (an App Store Connect team key, the .p8's text), APPLE_API_KEY_ID
# and APPLE_API_ISSUER.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (the source must carry the tag vVERSION)
        required: true
      # Why a string, not a choice: a choice preselects its first option, and a release of the
      # wrong platform must not be one click away. The check job refuses anything else.
      platform:
        description: The one platform this run releases, mac or windows
        required: true
      dry_run:
        description: Check and build, list the installers, and upload nothing anywhere
        type: boolean
        default: false
      # Why: the upload script comes from the version's tag, so a fault found in it while a release
      # is half done (0.22.1: a pointer's weak ETag) could only be mended by a new version. With
      # this the same tag's installers are published by the script of another ref (main).
      tools_ref:
        description: Take the upload script from this ref of the source instead of the tag (empty = the tag)
        required: false
        default: ''

permissions:
  contents: read

env:
  SOURCE_REPO: dongdongdongdongding/devalley-core
  VERSION: ${{ inputs.version }}
  PLATFORM: ${{ inputs.platform }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  # Before any build: the platform is one of the two, the tag is that version, and where the
  # platform stands in the bucket (new: build it; staged or live: commit it, no build; older than
  # what it has: refused). The upload checks again under the publish job's lock.
  check:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.platform.outputs.os }}
      state: ${{ steps.state.outputs.state }}
    steps:
      - id: platform
        name: The platform
        run: |
          case "$PLATFORM" in
            mac) echo 'os=["macos-latest"]' >> "$GITHUB_OUTPUT" ;;
            windows) echo 'os=["windows-latest"]' >> "$GITHUB_OUTPUT" ;;
            *) echo "platform must be mac or windows, not '$PLATFORM': one run releases one platform" >&2; exit 1 ;;
          esac
      - name: Get the version and the upload script from the source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: v${{ inputs.version }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: core
          sparse-checkout: |
            package.json
            scripts/build/release-upload.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The upload script of another ref, where one was asked for
        if: ${{ inputs.tools_ref != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.tools_ref }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: tools
          sparse-checkout: |
            scripts/build/release-upload.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put that script in the tag's place
        if: ${{ inputs.tools_ref != '' }}
        shell: bash
        run: cp tools/scripts/build/release-upload.mjs core/scripts/build/release-upload.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: state
        name: The tag is this version; where the platform stands
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$(node -p "require('./core/package.json').version")" != "$VERSION" ]; then
            echo "The source at v$VERSION isn't version $VERSION" >&2
            exit 1
          fi
          # The Worker must serve the feeds this release writes (the server is deployed first).
          if ! curl -sfI https://devalley.app/releases/latest.json | tr -d '\r' | grep -qix 'x-devalley-feeds: platforms'; then
            echo "devalley.app's Worker doesn't serve the per-platform feeds yet: deploy the server from this source first" >&2
            exit 1
          fi
          if ! grep -q -- "'--commit'" core/scripts/build/release-upload.mjs; then
            echo "v$VERSION's upload script releases both platforms at once; release it with that tag's workflow" >&2
            exit 1
          fi
          node core/scripts/build/release-upload.mjs --check --platform "$PLATFORM" --version "$VERSION"

  build:
    needs: check
    if: needs.check.outputs.state == 'new'
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.check.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: v${{ inputs.version }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The Rust devalley each app ships beside its CLI (the source's docs/dev-guide.md, "Rust
      # CLI"): the Mac app's Resources/cli/bin/devalley for `devalley run` and `devalley mcp`, the
      # Windows app's resources/cli/bin/devalley.exe for the same. The toolchain the source's
      # rust-toolchain.toml pins, through the runner's rustup, with both Mac targets, as one Mac
      # job builds the Apple silicon and the Intel app, and Windows' x64 (MSVC: the runner's Visual
      # Studio links it). A tag from before the Cargo workspace skips all of it; a tag whose Windows
      # app ships no binary (before 0.21.x's Windows half) has no Windows target in the desktop
      # build, which then packs none.
      - name: The Rust toolchain
        shell: bash
        working-directory: core
        run: |
          if [ ! -f rust-toolchain.toml ]; then exit 0; fi
          rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add x86_64-pc-windows-msvc
          fi
      - name: Cargo's downloads and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/rust-toolchain.toml', 'core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # Why before the installers: the desktop build stages target/<triple>/release/devalley for
      # each architecture into the app (the desktop's stage-rust.mjs) and finds it built.
      - name: Build the Rust devalley
        shell: bash
        working-directory: core
        run: |
          if [ ! -f Cargo.toml ]; then exit 0; fi
          quiet() { "$@" > "$RUNNER_TEMP/rust.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/rust.log"; exit 1; }; }
          if [ "$RUNNER_OS" = macOS ]; then
            for triple in aarch64-apple-darwin x86_64-apple-darwin; do
              quiet cargo build --release --locked -p devalley-cli --target "$triple"
              echo "$triple: $(lipo -archs "target/$triple/release/devalley")"
            done
          else
            quiet cargo build --release --locked -p devalley-cli --target x86_64-pc-windows-msvc
            echo "x86_64-pc-windows-msvc: $(target/x86_64-pc-windows-msvc/release/devalley.exe --version)"
          fi
      - name: Build the installers
        shell: bash
        working-directory: core
        # Why per runner: the Windows runner never receives the Mac's certificate or Apple's key.
        env:
          MAC_CERT_P12: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12 || '' }}
          MAC_CERT_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            echo "The source at v$VERSION isn't version $VERSION" >&2
            exit 1
          fi
          # Why: Git Bash's GNU tar can't take Windows paths; the desktop build needs Windows' tar.
          # Only tar.exe goes first (all of System32 would bring WSL's bash.exe ahead of Git's).
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p "$RUNNER_TEMP/windows-tar"
            cp /c/Windows/System32/tar.exe "$RUNNER_TEMP/windows-tar/tar.exe"
            export PATH="$RUNNER_TEMP/windows-tar:$PATH"
          fi
          # The Mac app is signed with the Developer ID and notarized, and the release check holds
          # it to that; Windows' isn't signed, nor sees a Mac's certificate. Why a stop without
          # them: the release notes say the Mac app opens at once. Why kept in the shell, not the
          # environment, until `npm run dist`: npm ci and the build run packages' own scripts.
          if [ "$RUNNER_OS" = macOS ]; then
            for name in MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              if [ -z "${!name}" ]; then
                echo "The Mac app is signed and notarized: set $name in this repository's secrets" >&2
                exit 1
              fi
            done
          fi
          cert="$MAC_CERT_P12" cert_password="$MAC_CERT_PASSWORD" api_key="$APPLE_API_KEY_P8"
          key_id="$APPLE_API_KEY_ID" issuer="$APPLE_API_ISSUER"
          unset MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
          # Why quiet: the log is public; on a failure only its last lines are shown.
          quiet() { "$@" > "$RUNNER_TEMP/step.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/step.log"; exit 1; }; }
          quiet npm ci --no-audit --no-fund
          quiet npm run build
          # Why any of three folders: the app lives in apps/desktop now, in packages/desktop for tags
          # of 2026-10-18 to 10-20, in desktop/ before. The upload below reads the one that is there.
          d=apps/desktop; [ -d "$d" ] || d=packages/desktop; [ -d "$d" ] || d=desktop
          echo "RELEASE_DIR=core/$d/release" >> "$GITHUB_ENV"
          cd "$d"
          # Why only with a lockfile here: before the move the app had one of its own; now the root's
          # npm ci (workspaces) has installed it already.
          if [ -f package-lock.json ]; then quiet npm ci --no-audit --no-fund; fi
          if [ "$RUNNER_OS" = macOS ]; then
            # Why a keychain of our own, not CSC_LINK: electron-builder 26.15 unlocks the keychain it
            # makes for CSC_LINK with the certificate's password (set-key-partition-list -k), which
            # macOS refuses. Given CSC_KEYCHAIN and no CSC_LINK, it finds the identity there.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password=$(openssl rand -base64 24)
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            printf '%s' "$cert" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            quiet security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$cert_password" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/cert.p12"
            quiet security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            printf '%s' "$api_key" > "$RUNNER_TEMP/AuthKey.p8"
            quiet env CSC_KEYCHAIN="$keychain" \
              APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" APPLE_API_KEY_ID="$key_id" \
              APPLE_API_ISSUER="$issuer" DEVALLEY_EXPECT_NOTARIZED=1 npm run dist
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            security delete-keychain "$keychain"
            unset keychain_password
          else
            quiet env CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist
          fi
          unset cert cert_password api_key
          if [ "$RUNNER_OS" = Windows ]; then
            cli=release/win-unpacked/resources/cli
          else
            cli=release/mac-arm64/Devalley.app/Contents/Resources/cli
          fi
          node -e "if (typeof require('./$cli/node_modules/@lydell/node-pty').spawn !== 'function') process.exit(1)"
          shopt -s nullglob
          for file in release/*.exe release/*.dmg; do basename "$file"; done
      # Why after the build as well as check-release: each Mac app must carry the binary for its own
      # architecture (an Intel app with an Apple silicon binary would fall back to Node for good),
      # and the Apple silicon one must answer this version, as the daemon's start check asks.
      - name: Check the Rust devalley in the Mac apps
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ ! -f core/Cargo.toml ]; then exit 0; fi
          for pair in release/mac-arm64/Devalley.app:arm64 release/mac/Devalley.app:x86_64; do
            app="$(dirname "$RELEASE_DIR")/${pair%:*}"
            archs=$(lipo -archs "$app/Contents/Resources/cli/bin/devalley")
            [ "$archs" = "${pair##*:}" ] || { echo "${pair%:*} carries a devalley for $archs" >&2; exit 1; }
          done
          answer=$("$(dirname "$RELEASE_DIR")/release/mac-arm64/Devalley.app/Contents/Resources/cli/bin/devalley" --version)
          [ "$answer" = "$VERSION" ] || { echo "the Rust devalley answers $answer, not $VERSION" >&2; exit 1; }
      # Why: the Windows app must carry devalley.exe and it must answer this version, as the
      # daemon's start check asks (a tag whose desktop build packs none for Windows skips this).
      - name: Check the Rust devalley in the Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! grep -q x86_64-pc-windows-msvc core/apps/desktop/scripts/rust-binary.mjs 2>/dev/null; then exit 0; fi
          answer=$("$(dirname "$RELEASE_DIR")/release/win-unpacked/resources/cli/bin/devalley.exe" --version)
          [ "$answer" = "$VERSION" ] || { echo "the Rust devalley answers $answer, not $VERSION" >&2; exit 1; }
      # Why no artifact in a dry run: an artifact of a public repository's run can be downloaded,
      # and a dry run must leave no installer anywhere. Names, sizes and digests only.
      - name: What a release would upload (dry run)
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          shopt -s nullglob
          # Why the look: latest.yml is a name, not a pattern, so nullglob keeps it in the list where
          # the build made none (the Mac's: the feed comes from the Windows build).
          for file in "$RELEASE_DIR"/*.exe "$RELEASE_DIR"/*.dmg "$RELEASE_DIR"/*.blockmap "$RELEASE_DIR"/latest.yml; do
            [ -e "$file" ] || continue
            node -e "const b=require('fs').readFileSync(process.argv[1]);console.log(require('path').basename(process.argv[1]),b.length,require('crypto').createHash('sha512').update(b).digest('base64'))" "$file"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: installers-${{ matrix.os }}
          # The feed (latest.yml) and the setup exe's blockmap come from the Windows build, the dmgs
          # from the Mac's (a run builds one of the two); the upload script needs them beside the installers. Why one folder: upload-artifact roots
          # the artifact at the deepest folder all its paths share, existing or not, and the upload
          # script reads the files from its top (scripts/check/__tests__/public-release.test.mjs).
          path: |
            ${{ env.RELEASE_DIR }}/*.exe
            ${{ env.RELEASE_DIR }}/*.dmg
            ${{ env.RELEASE_DIR }}/*.blockmap
            ${{ env.RELEASE_DIR }}/latest.yml
          if-no-files-found: error
          retention-days: 1

  # One publish at a time in this repository: the upload's read of the bucket, its pointer write,
  # the page and the notes happen under this lock. Why not cancel: a release in flight must finish.
  # (GitHub keeps one waiting run per group, and a third dispatch cancels the waiting one: dispatch
  # one at a time.) The lock doesn't reach another repository or a run by hand; R2's conditional
  # writes in release-upload.mjs do: a pointer or a record is written only if it is still what the
  # run read.
  publish:
    needs: [check, build]
    if: ${{ !inputs.dry_run && !cancelled() && needs.check.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    concurrency:
      group: devalley-release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STATE: ${{ needs.check.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: page
      - name: Get the page and the upload script from the source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: v${{ inputs.version }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: core
          sparse-checkout: |
            public
            scripts/build/release-upload.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The upload script of another ref, where one was asked for
        if: ${{ inputs.tools_ref != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.tools_ref }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: tools
          sparse-checkout: |
            scripts/build/release-upload.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put that script in the tag's place
        if: ${{ inputs.tools_ref != '' }}
        shell: bash
        run: cp tools/scripts/build/release-upload.mjs core/scripts/build/release-upload.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: env.STATE == 'new'
        with:
          path: installers
          merge-multiple: true
      - name: Upload to devalley.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p installers
          if [ "$STATE" = new ]; then
            node core/scripts/build/release-upload.mjs installers --platform "$PLATFORM" \
              --version "$VERSION" --record installers/version.json \
              --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          else
            # Staged or live: what the bucket holds, every byte checked, made current; no build.
            node core/scripts/build/release-upload.mjs --commit "$VERSION" --platform "$PLATFORM" \
              --record installers/version.json
          fi
      # Why only from a version at least the page's: the platforms are released apart, and a later
      # run of an older tag (Windows catching up) must not put an older page back. The page's
      # version is kept in its own file, .release-version (the last commit's subject before it).
      - name: Bring the download page up to date
        run: |
          shown=$(cat page/.release-version 2>/dev/null || git -C page log -1 --format=%s | sed -n 's/^Devalley \([0-9.]*\)$/\1/p')
          if [ -n "$shown" ] && [ "$(printf '%s\n%s\n' "$shown" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "The download page is from $shown, newer than $VERSION: left as it is."
            exit 0
          fi
          rsync -a --delete --exclude .git --exclude .github --exclude .release-version core/public/ page/
          echo "$VERSION" > page/.release-version
          rm -rf core
          cd page
          git add -A
          if git diff --cached --quiet; then
            echo "The download page is already up to date."
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Devalley $VERSION"
            git push -q
          fi
      # One release page per version: the first platform's run makes it, the other's rewrites it
      # with both, from the platforms the root latest.json has at this version (installers/version.json).
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          # Why a placeholder: a quoted heredoc keeps the backticks as text.
          cat > notes.md <<'NOTES'
          ## Install

          Installers: **https://devalley.app/get**, or directly:

          [windows] - **Windows installer:** https://devalley.app/download/v__V__/Devalley-__V__-win-x64-setup.exe
          [windows] - **Windows portable:** https://devalley.app/download/v__V__/Devalley-__V__-win-x64-portable.exe
          [mac] - **macOS (Apple silicon):** https://devalley.app/download/v__V__/Devalley-__V__-mac-arm64.dmg
          [mac] - **macOS (Intel):** https://devalley.app/download/v__V__/Devalley-__V__-mac-x64.dmg
          [not-windows] - **Windows:** __V__ isn't out for Windows yet (the Mac and Windows are released apart); the Windows app stays on its version until it is.
          [not-mac] - **macOS:** __V__ isn't out for macOS yet (the Mac and Windows are released apart); the Mac app stays on its version until it is.

          [windows] Already have Devalley on Windows? The installed app downloads __V__ in the background as soon as it finds it, and its tray menu then offers **Install __V__ and restart** (in Korean, **__V__ 설치하고 다시 시작**); it installs only when you click that. With the portable build the tray menu offers **Get Devalley __V__…** (in Korean, **새 버전 __V__ 받기…**) and your browser downloads the new file: quit Devalley first, then run the new file.
          [mac] Already have Devalley on a Mac? The tray menu offers **Get Devalley __V__…** (in Korean, **새 버전 __V__ 받기…**) and your browser downloads the new file: quit Devalley, open the disk image and drag Devalley to Applications, replacing the old one.
          Devalley 0.22.0 and earlier on a Mac, and the portable build up to 0.22.0, are offered a version once both platforms have it.

          [mac] The Mac app is signed and notarized by Apple, so it opens at once.
          [windows] The Windows app isn't code-signed yet: on the SmartScreen warning choose **More info** → **Run anyway**.

          Then click **Connect Claude Code** in the village, and any `claude` session moves in on its next prompt.
          NOTES
          sed -i "s/__V__/$VERSION/g" notes.md
          for platform in mac windows; do
            # The platforms whose release of this version is live (the root latest.json as committed:
            # a platform only staged doesn't count).
            if node -e "const p=require('./installers/version.json').platforms||{};process.exit(p[process.argv[1]]?.version===process.env.VERSION?0:1)" "$platform"; then
              sed -i "s/^\[$platform\] //; /^\[not-$platform\] /d" notes.md
            else
              sed -i "/^\[$platform\] /d; s/^\[not-$platform\] //" notes.md
            fi
          done
          # Why both paths: a release made on GitHub's website already exists when this runs.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Devalley $VERSION" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Devalley $VERSION" --notes-file notes.md
          fi
