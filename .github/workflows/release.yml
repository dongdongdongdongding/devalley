# The public repository's release workflow (dongdongdongdongding/devalley, .github/workflows/
# release.yml); this is the copy kept with the source. It builds the installers from this
# private repository, uploads them to devalley.app (the site's R2 bucket, where the download
# page, the app's update check and the Windows installer's updater read them) and publishes the
# release notes on the public Releases page, so releases don't spend this repository's Actions
# minutes. It only builds: checks and tests run before a release, on the source side. Its logs
# are public, so its steps print as little as they can.
#
# Started by hand only (Actions → Release → Run workflow, or `gh workflow run release.yml
# -R dongdongdongdongding/devalley -f version=X.Y.Z`), so no pull request or fork can reach the
# secrets: CORE_READ_TOKEN (a fine-grained token with Contents: Read-only on devalley-core),
# CLOUDFLARE_API_TOKEN (account-wide R2: Admin Read & Write or Workers R2 Storage: Edit; a token
# scoped to the bucket alone is refused, see docs/platform.md "Releases") and
# CLOUDFLARE_ACCOUNT_ID; for the Mac app's signature and notarization, MAC_CERT_P12 (the
# "Developer ID Application" certificate with its key, a .p12 in base64), MAC_CERT_PASSWORD (its
# password), APPLE_API_KEY_P8 (an App Store Connect team key, the .p8's text), APPLE_API_KEY_ID
# and APPLE_API_ISSUER.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (the source must carry the tag vVERSION)
        required: true

permissions:
  contents: read

env:
  SOURCE_REPO: dongdongdongdongding/devalley-core
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: v${{ inputs.version }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the installers
        shell: bash
        working-directory: core
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            echo "The source at v$VERSION isn't version $VERSION" >&2
            exit 1
          fi
          # Why: Git Bash's GNU tar can't take Windows paths; the desktop build needs Windows' tar.
          # Only tar.exe goes first (all of System32 would bring WSL's bash.exe ahead of Git's).
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p "$RUNNER_TEMP/windows-tar"
            cp /c/Windows/System32/tar.exe "$RUNNER_TEMP/windows-tar/tar.exe"
            export PATH="$RUNNER_TEMP/windows-tar:$PATH"
          fi
          # The Mac app is signed with the Developer ID and notarized, and the release check holds
          # it to that; Windows' isn't signed, nor sees a Mac's certificate. Why a stop without
          # them: the release notes say the Mac app opens at once. Why kept in the shell, not the
          # environment, until `npm run dist`: npm ci and the build run packages' own scripts.
          if [ "$RUNNER_OS" = macOS ]; then
            for name in MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              if [ -z "${!name}" ]; then
                echo "The Mac app is signed and notarized: set $name in this repository's secrets" >&2
                exit 1
              fi
            done
          fi
          cert="$MAC_CERT_P12" cert_password="$MAC_CERT_PASSWORD" api_key="$APPLE_API_KEY_P8"
          key_id="$APPLE_API_KEY_ID" issuer="$APPLE_API_ISSUER"
          unset MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
          # Why quiet: the log is public; on a failure only its last lines are shown.
          quiet() { "$@" > "$RUNNER_TEMP/step.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/step.log"; exit 1; }; }
          quiet npm ci --no-audit --no-fund
          quiet npm run build
          # Why any of three folders: the app lives in apps/desktop now, in packages/desktop for tags
          # of 2026-10-18 to 10-20, in desktop/ before. The upload below reads the one that is there.
          d=apps/desktop; [ -d "$d" ] || d=packages/desktop; [ -d "$d" ] || d=desktop
          echo "RELEASE_DIR=core/$d/release" >> "$GITHUB_ENV"
          cd "$d"
          # Why only with a lockfile here: before the move the app had one of its own; now the root's
          # npm ci (workspaces) has installed it already.
          if [ -f package-lock.json ]; then quiet npm ci --no-audit --no-fund; fi
          if [ "$RUNNER_OS" = macOS ]; then
            # Why a keychain of our own, not CSC_LINK: electron-builder 26.15 unlocks the keychain it
            # makes for CSC_LINK with the certificate's password (set-key-partition-list -k), which
            # macOS refuses. Given CSC_KEYCHAIN and no CSC_LINK, it finds the identity there.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password=$(openssl rand -base64 24)
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            printf '%s' "$cert" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            quiet security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$cert_password" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/cert.p12"
            quiet security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            printf '%s' "$api_key" > "$RUNNER_TEMP/AuthKey.p8"
            quiet env CSC_KEYCHAIN="$keychain" \
              APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" APPLE_API_KEY_ID="$key_id" \
              APPLE_API_ISSUER="$issuer" DEVALLEY_EXPECT_NOTARIZED=1 npm run dist
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            security delete-keychain "$keychain"
            unset keychain_password
          else
            quiet env CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist
          fi
          unset cert cert_password api_key
          if [ "$RUNNER_OS" = Windows ]; then
            cli=release/win-unpacked/resources/cli
          else
            cli=release/mac-arm64/Devalley.app/Contents/Resources/cli
          fi
          node -e "if (typeof require('./$cli/node_modules/@lydell/node-pty').spawn !== 'function') process.exit(1)"
          shopt -s nullglob
          for file in release/*.exe release/*.dmg; do basename "$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # The feed (latest.yml) and the setup exe's blockmap come from the Windows build; the
          # upload script needs them beside the installers. Why one folder: upload-artifact roots
          # the artifact at the deepest folder all its paths share, existing or not, and the upload
          # script reads the files from its top (scripts/check/__tests__/public-release.test.mjs).
          path: |
            ${{ env.RELEASE_DIR }}/*.exe
            ${{ env.RELEASE_DIR }}/*.dmg
            ${{ env.RELEASE_DIR }}/*.blockmap
            ${{ env.RELEASE_DIR }}/latest.yml
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: page
      - name: Get the page and the upload script from the source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: v${{ inputs.version }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          path: core
          sparse-checkout: |
            public
            scripts/build/release-upload.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Upload to devalley.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node core/scripts/build/release-upload.mjs installers --version "$VERSION" \
            --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
      - name: Bring the download page up to date
        run: |
          rsync -a --delete --exclude .git --exclude .github core/public/ page/
          rm -rf core
          cd page
          git add -A
          if git diff --cached --quiet; then
            echo "The download page is already up to date."
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Devalley $VERSION"
            git push -q
          fi
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          # Why a placeholder: a quoted heredoc keeps the backticks as text.
          cat > notes.md <<'NOTES'
          ## Install

          Installers: **https://devalley.app/get**, or directly:

          - **Windows installer:** https://devalley.app/download/v__V__/Devalley-__V__-win-x64-setup.exe
          - **Windows portable:** https://devalley.app/download/v__V__/Devalley-__V__-win-x64-portable.exe
          - **macOS (Apple silicon):** https://devalley.app/download/v__V__/Devalley-__V__-mac-arm64.dmg
          - **macOS (Intel):** https://devalley.app/download/v__V__/Devalley-__V__-mac-x64.dmg

          Already have Devalley? On Windows the installed app downloads __V__ in the background as soon as it finds it, and its tray menu then offers **Install __V__ and restart** (in Korean, **__V__ 설치하고 다시 시작**); it installs only when you click that. On macOS and with the portable build the tray menu offers **Get Devalley __V__…** (in Korean, **새 버전 __V__ 받기…**) and your browser downloads the new file: on a Mac, quit Devalley, open the disk image and drag Devalley to Applications, replacing the old one; with the portable build, quit Devalley first, then run the new file.

          The Mac app is signed and notarized by Apple, so it opens at once. The Windows app isn't code-signed yet: on the SmartScreen warning choose **More info** → **Run anyway**.

          Then click **Connect Claude Code** in the village, and any `claude` session moves in on its next prompt.
          NOTES
          sed -i "s/__V__/$VERSION/g" notes.md
          # Why both paths: a release made on GitHub's website already exists when this runs.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Devalley $VERSION" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Devalley $VERSION" --notes-file notes.md
          fi
